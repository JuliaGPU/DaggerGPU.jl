steps:
  - label: "[CUDA] Julia v1.10"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.10"
      - JuliaCI/julia-test#v1: ~
      - JuliaCI/julia-coverage#v1:
          codecov: false # TODO
    agents:
      queue: "cuda"
    if: build.message !~ /\[skip tests\]/
    timeout_in_minutes: 20
    env:
      CI_USE_CUDA: "1"

  - label: "[ROCm] Julia v1.10"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.10"
      - JuliaCI/julia-test#v1: ~
      - JuliaCI/julia-coverage#v1:
          codecov: false # TODO
    agents:
      queue: "rocm"
    if: build.message !~ /\[skip tests\]/
    timeout_in_minutes: 20
    env:
      CI_USE_ROCM: "1"

  - label: "[oneAPI] Julia v1.10"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.10"
      - JuliaCI/julia-test#v1: ~
      - JuliaCI/julia-coverage#v1:
          codecov: false # TODO
    agents:
      queue: "oneapi"
    if: build.message !~ /\[skip tests\]/
    timeout_in_minutes: 20
    env:
      CI_USE_ONEAPI: "1"
